---
layout: default
title: ホーム
---
<section class="profile" aria-labelledby="profile-name">
  <p class="eyebrow">プロフィール</p>
  <h1 id="profile-name">toyama kou</h1>
  <p class="profile-copy">ゲームサーバー開発者。クライアント開発とテクニカルアートへの転向を準備中。</p>
</section>

<section class="section-block" aria-labelledby="posts-title">
  <div class="section-heading">
    <div>
      <p class="eyebrow">記事一覧</p>
      <h2 id="posts-title">記事</h2>
    </div>
  </div>
  {% if site.posts.size > 0 %}
    <ul class="post-list">
      {% for post in site.posts %}
        {% include post-item.html post=post %}
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty-state">記事を準備しています。</p>
  {% endif %}
</section>
