---
layout: default
---
<article class="article">
  <header class="article-header">
    <p class="eyebrow">{% include category-names.html categories=page.categories %}</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y年%m月%d日' }}</time>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/posts/' | relative_url }}">記事一覧へ戻る</a>
</article>
