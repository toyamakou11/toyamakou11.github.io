<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <div class="site-frame">
      <header class="site-header">
        <div class="shell header-inner">
          <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
          <nav class="site-nav" aria-label="メインナビゲーション">
            <a href="{{ '/' | relative_url }}">ホーム</a>
            <a href="{{ '/categories/development/' | relative_url }}">開発</a>
            <a href="{{ '/categories/art/' | relative_url }}">アート</a>
          </nav>
        </div>
      </header>
      <main id="main" class="shell">
        {{ content }}
      </main>
      <footer class="site-footer">
        <div class="shell footer-inner">
          <span>© {{ site.time | date: '%Y' }} toyama kou</span>
        </div>
      </footer>
    </div>
  </body>
</html>
