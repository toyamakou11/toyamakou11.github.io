<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="メインナビゲーション">
          <a href="{{ '/posts/' | relative_url }}">記事</a>
          <a href="{{ '/categories/development/' | relative_url }}">開発</a>
          <a href="{{ '/categories/art/' | relative_url }}">アート</a>
          <a href="{{ '/about/' | relative_url }}">このブログ</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
        <a href="{{ '/' | relative_url }}">トップへ戻る</a>
      </div>
    </footer>
  </body>
</html>
